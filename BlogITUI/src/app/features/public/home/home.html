<div class="container mt-5">

    <!-- <h1 class="mb-4">Latest Blog Posts</h1> -->

    <!-- Loading -->
    <!-- <div *ngIf="blogRef.isLoading()" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div> -->

    <!-- Blogs -->
    <div class="row" *ngIf="!blogRef.isLoading() && (blogRef.value() ?? []).length > 0">
        <div
            class="col-lg-4 col-md-6 mb-4"
            *ngFor="let blog of (blogRef.value() ?? [])">
            <div class="card h-100 shadow-sm">
                <img
                    [src]="blog.featuredImageUrl"
                    class="card-img-top"
                    [alt]="blog.title"
                    style="height:220px; object-fit:cover;">
                <div class="card-body d-flex flex-column">
                    <!-- Categories -->
                    <div class="mb-2">
                        <span
                            class="badge bg-primary me-1"
                            *ngFor="let category of blog.categories">

                            {{ category.name }}

                        </span>
                    </div>
                    <!-- Title -->
                    <h4 class="card-title">
                        {{ blog.title }}
                    </h4>
                    <!-- Date -->
                    <small class="text-muted mb-2">
                        {{ blog.createdTimeStamp | date:'longDate' }}
                    </small>
                    <!-- Description -->
                    <p class="card-text">
                        {{ blog.description }}
                    </p>
                    <!-- Read More -->
                    <a
                        class="btn btn-primary mt-auto"
                        [routerLink]="['/blog', blog.urlHandle]">

                        Read More
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- No blogs -->
    <div
        class="text-center mt-5"
        *ngIf="!blogRef.isLoading() && (blogRef.value() ?? []).length === 0">

        <h3>No blog posts found.</h3>
        <p class="text-muted">
            Check back later for new content.
        </p>
    </div>
</div>
